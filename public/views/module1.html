<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#dff6fb"><title>LectoAprende · ¡Reto con Lito!</title><link rel="stylesheet" href="/css/kids.css"></head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><img src="/images/lito.png" alt=""><span>Lecto<span>Aprende</span></span></a><nav class="topnav" aria-label="Navegación principal"><a href="/menu">🗺️ Aventuras</a><a href="/stories">📖 Cuentos</a><a href="/progress">⭐ Logros</a><a href="/adults">⚙️ Adultos</a></nav></header><main class="paper game"><div class="game-header"><img class="mini-lito" src="/images/lito.png" alt="Lito"><div><span class="pill" id="number">Mundo</span><h1 id="title">¡Vamos a jugar!</h1><p id="exercise-count" class="level-counter">Reto 1 de 5</p></div></div><div class="progress-track" role="progressbar" aria-label="Avance en esta aventura" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track"><div class="progress-fill" id="bar" style="width:0%"></div></div><section class="instruction"><p id="instruction">¡Escucha con atención!</p><div class="listen-actions"><button type="button" class="btn btn-soft" id="listen">🔊 Escuchar a Lito</button><button type="button" class="navbtn mini-button" id="stop-audio">⏹ Detener audio</button></div></section><div id="visual-hint" class="visual-hint" hidden></div><h2 class="prompt" id="prompt"></h2><div class="options" id="options"></div><p class="order-status hide" id="order" aria-live="polite"></p><p class="status" id="status" role="status" aria-live="polite">✨ ¡Tú puedes!</p><div class="actions play-actions"><button class="btn btn-soft hide" id="retry" type="button">↺ Volver a intentar</button><button class="btn btn-primary hide" id="next" type="button">➡️ Siguiente reto</button><a class="btn btn-soft hide" id="repeat" href="/menu">↺ Repetir mundo</a><a class="btn btn-primary hide" id="finish" href="/progress">🏆 V
