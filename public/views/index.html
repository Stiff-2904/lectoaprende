<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LectoAprende - Bienvenida</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        skyBlue: '#4DAFEA',
                        softYellow: '#FFD966',
                        mintGreen: '#75D6B1',
                        softCoral: '#FF8A80',
                        darkBlue: '#294C60',
                    },
                    fontFamily: {
                        title: ['Fredoka', 'sans-serif'],
                        body: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-escenario font-body">

    <!-- ENCABEZADO SUPERIOR: Título centrado con movimiento -->
    <header class="w-full py-6 px-6 flex justify-center items-center z-20">
        <div class="animate-letters bg-white/80 backdrop-blur-md px-8 py-2.5 rounded-3xl shadow-xl border-2 border-white">
            <h1 class="font-title font-bold text-4xl sm:text-5xl text-skyBlue drop-shadow-sm tracking-wide">
                Lecto<span class="text-softCoral">Aprende</span>
            </h1>
        </div>
    </header>

    <!-- CONTENIDO CENTRAL DE BIENVENIDA -->
    <main class="w-full flex-grow flex flex-col lg:flex-row items-center justify-center px-6 sm:px-12 lg:px-20 gap-8 z-10">

        <div class="flex flex-col items-center justify-center lg:w-1/2 relative">
            <div class="animate-float relative flex flex-col items-center cursor-pointer" onclick="saludarLito()">

                <div class="w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center relative">
                    <img src="../images/lito.png" alt="Lito el Perico" class="w-full h-full object-contain drop-shadow-2xl hover:scale-105 transition-transform duration-300">
                </div>
                <div class="mt-2 text-darkBlue font-title font-extrabold text-xl bg-softYellow border-4 border-amber-400 px-6 py-2 rounded-full shadow-lg animate-bounce">
                    ¡Hola! Soy Lito 🦜
                </div>
                <span class="absolute -top-6 left-4 text-3xl animate-bounce">⭐</span>
                <span class="absolute top-10 -right-6 text-3xl animate-pulse">🎵</span>
            </div>
        </div>

        <div class="flex flex-col items-center lg:items-start text-center lg:text-left lg:w-1/2">
            <div class="bg-white/90 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-xl border-4 border-white mb-6">
                <h2 class="text-4xl sm:text-6xl font-title font-bold text-skyBlue mb-3 drop-shadow-sm">
                    ¡Hola! Soy <span class="text-softCoral">Lito</span>
                </h2>
                <p class="text-xl sm:text-3xl text-darkBlue font-semibold">
                    Jugamos, escuchamos y aprendemos 🎶📚
                </p>
            </div>

            <button onclick="iniciarAventura()" class="bg-softYellow hover:bg-yellow-400 text-darkBlue font-title font-bold text-2xl sm:text-3xl px-12 py-5 rounded-3xl shadow-2xl border-b-8 border-yellow-600 flex items-center space-x-4 transition transform hover:scale-105">
                <span class="text-3xl">⭐</span>
                <span>COMENZAR</span>
            </button>
        </div>

    </main>

    <footer class="w-full py-4 px-8 flex flex-col sm:flex-row items-center justify-between bg-transparent z-10">
        <div class="text-darkBlue font-title font-bold text-sm sm:text-base drop-shadow-sm">
            Universidad Nacional • Proyecto Multimedia Educativo Primer Grado 📚
        </div>

    </footer>

    <!-- SCRIPT DE INTERACCIÓN -->
    <script>
        function saludarLito() {
            confetti({
                particleCount: 70,
                spread: 60,
                origin: { y: 0.6 }
            });

            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("¡Hola amiguito! ¡Vamos a aprender jugando!");
                utterance.lang = 'es-ES';
                window.speechSynthesis.speak(utterance);
            }
        }

        function iniciarAventura() {
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.5 }
            });

            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("¡Genial! Comencemos la aventura.");
                utterance.lang = 'es-ES';
                window.speechSynthesis.speak(utterance);
            }

            setTimeout(() => {
                window.location.href = '/menu';
            }, 800);
        }
    </script>
</body>
</html>
